<html>
	<head>
	<title>PS4 Playground (Auto Detect)</title>
	<link rel="shortcut icon" type="image/x-icon" href="../img/favicon.ico">
	<link rel="stylesheet" type="text/css" href="../css/metro-bootstrap.css">
	</head>
	<script>
(function () {
  var ua = navigator.userAgent;
  var match = ua.match(/PlayStation(?:;\s*PlayStation)?(?: 4\/| 4 )(\d+\.\d+)/);
  if (!match) {
    document.write('<div class="alert alert-danger"><strong>No Playstation 4 detected!</strong></div>');
    return;
  }

  var fw = match[1];
  var legacy = {
    "1.76":"../1.76/index.html",
    "3.55":"../3.55/index.html",
    "4.05":"../4.05/index.html",
    "4.55":"../4.55/index.html",
    "4.74":"../4.74/index.html",
    "5.05":"../5.05/index.html",
    "5.07":"../5.05/index.html",
    "6.72":"../6.72/index.html"
  };

  var psfree = [
    "7.00","7.01","7.02","7.50","7.51","7.55",
    "8.00","8.01","8.03","8.50","8.52",
    "9.00","9.03","9.04","9.50","9.51","9.60"
  ];

  if (legacy[fw]) {
    location.replace(legacy[fw]);
    return;
  }

  if (psfree.indexOf(fw) !== -1) {
    location.replace("../psfree/index.html");
    return;
  }

  document.write('<div class="alert alert-danger"><strong>Unsupported PS4 firmware: ' + fw + '</strong></div>');
})();
</script>

</html>
